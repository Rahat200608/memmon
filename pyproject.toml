[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memmon"
version = "0.1.0"
description = "Universal memory/CPU monitor for any Python program"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["psutil"]

[tool.setuptools]
packages = ["memmon"]
